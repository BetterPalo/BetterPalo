name: Commit messages

# Pull requests are squash merged (ADR 0004), so the pull request title becomes
# the one commit subject on main. The title must therefore be a conventional
# commit. Branch commits never reach main and are not checked.
# See CONTRIBUTING.md#commit-messages.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-commits:
    runs-on: ubuntu-latest
    steps:
      - name: Check the pull request title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|data|content|i18n|style|refactor|test|ci|chore)(\([a-z0-9/,-]+\))?!?: [a-z].+$'

          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a conventional commit, for example 'feat(services): add cedula guide'. Got: $TITLE"
            exit 1
          fi

          if [ "${#TITLE}" -gt 72 ]; then
            echo "::warning::PR title is ${#TITLE} characters; keep it under 72: $TITLE"
          fi
