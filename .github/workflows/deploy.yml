name: Deploy

# Production deploys the artifact CI tested. This workflow starts only after the
# CI workflow finishes successfully on `main`, downloads the `site` artifact from
# that run, deploys it with Wrangler, and checks the live site.
#
# Pull request previews stay on Cloudflare Workers Builds; they are not
# production deploys and never touch the live site.
#
# See ADR 0012 and docs/maintainers.md#deploying. Workflow changes need
# @Rurur8 as first reviewer, @STR4T-coder as second reviewer; the lead merges.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

# Two merges in a row must not deploy out of order. A queued deploy waits for
# the one in progress instead of cancelling it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy
    # Off until the lead adds the Cloudflare secrets and the production
    # environment, then sets the repository variable DEPLOY_ENABLED to true.
    if: >-
      vars.DEPLOY_ENABLED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://betterpalo.betterpalogov.workers.dev' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit CI tested, not whatever `main` points at now.
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download the site CI tested
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check the artifact is complete
        shell: bash
        run: test -s dist/index.html && test -s dist/fil/index.html

      - name: Deploy to production
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production
        run: pnpm smoke
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL || 'https://betterpalo.betterpalogov.workers.dev' }}

      - name: Record the deployment
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          {
            echo "### Production deploy"
            echo
            echo "- Commit: \`${{ github.event.workflow_run.head_sha }}\`"
            echo "- CI run: ${{ github.event.workflow_run.html_url }}"
            echo "- Site: ${{ vars.PRODUCTION_URL || 'https://betterpalo.betterpalogov.workers.dev' }}"
            echo
            echo '```text'
            pnpm exec wrangler deployments list 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain how to roll back
        if: failure()
        shell: bash
        run: |
          {
            echo "### Deploy failed"
            echo
            echo "Production may be serving the previous version or a broken one."
            echo "Roll back with the project lead:"
            echo
            echo '```sh'
            echo 'pnpm exec wrangler deployments list'
            echo 'pnpm exec wrangler rollback <version-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
