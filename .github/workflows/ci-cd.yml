name: CI/CD

# Quality gates for every pull request and for `main`, plus the production deploy
# that follows a green run on `main`. One workflow so the deploy waits for the
# exact jobs above instead of a separate `workflow_run`.
#
# The heavy jobs are skipped when a change touches only documentation (see the
# `changes` job). The `ci` job at the end always runs and fails if any job
# above failed or was cancelled, so it is the one required status check for
# this workflow: it never hangs on a docs-only pull request and never passes
# when a test failed.
#
# Workflow changes need @Rurur8 as first reviewer and @STR4T-coder as second
# reviewer; the project lead merges (docs/team.md#review-routing).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # `code` is true when at least one changed file is outside the
      # documentation. A new file anywhere else runs the full pipeline by
      # default, so a config change can never skip the checks it affects.
      # Markdown under `src/` is site content, so only top-level and
      # `.github/` Markdown counts as documentation.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!*.md'
              - '!.github/**/*.md'

  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check Astro and TypeScript
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  # Runs beside `quality` instead of after it: the build does not need the
  # checks to finish, and e2e and lighthouse wait for `build` only. `ci` and
  # `deploy` still wait for every job.
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the site
        run: pnpm build
      # `e2e` and `lighthouse` test this exact artifact instead of building
      # again, so what they check is what would deploy.
      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          # Playwright serves the artifact above instead of rebuilding it.
          PLAYWRIGHT_SERVE_PREBUILT: '1'
          # Use the Chrome already on GitHub's Ubuntu runners (playwright.config.ts)
          # instead of downloading a browser on every run.
          PLAYWRIGHT_CHANNEL: chrome
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: [changes, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          # Chrome is preinstalled on GitHub's Ubuntu runners.
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # The required status check. When the change touches code, every job above
  # must have finished as `success`; a job that was skipped by mistake does not
  # count as a pass. When the change is documentation only, every heavy job must
  # have been skipped. A failed or cancelled job always fails `ci`.
  ci:
    name: ci
    needs: [changes, quality, build, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs above
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          expected=skipped
          if [ "$CODE" = "true" ]; then expected=success; fi

          failed=0
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes finished as '$CHANGES', expected 'success'"
            failed=1
          fi
          for pair in "quality=$QUALITY" "build=$BUILD" "e2e=$E2E" "lighthouse=$LIGHTHOUSE"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "$expected" ]; then
              echo "::error::$job finished as '$result', expected '$expected'"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "ci passed (code changed: ${CODE:-false})"

  deploy:
    name: deploy
    needs: [changes, quality, build, e2e, lighthouse]
    if: >-
      always() &&
      needs.changes.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true' &&
      needs.quality.result == 'success' &&
      needs.build.result == 'success' &&
      needs.e2e.result == 'success' &&
      needs.lighthouse.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL || 'https://betterpalo.betterpalogov.workers.dev' }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download the site CI tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist

      - name: Check the artifact is complete
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/fil/index.html
          test -s dist/404.html
          test -d dist/pagefind

      - name: Deploy to production
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Check production
        run: pnpm smoke
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL || 'https://betterpalo.betterpalogov.workers.dev' }}

      - name: Record the deployment
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          SITE_URL: ${{ vars.PRODUCTION_URL || 'https://betterpalo.betterpalogov.workers.dev' }}
        run: |
          {
            echo "### Production deploy"
            echo
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Site: $SITE_URL"
            echo
            echo '```text'
            pnpm exec wrangler deployments list 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain how to roll back
        if: failure()
        shell: bash
        run: |
          {
            echo "### Deploy failed"
            echo
            echo "Production may be serving the previous version or a broken one."
            echo "Roll back with the project lead:"
            echo
            echo '```sh'
            echo 'pnpm exec wrangler deployments list'
            echo 'pnpm exec wrangler rollback <version-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
