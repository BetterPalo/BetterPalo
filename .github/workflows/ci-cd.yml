name: CI/CD

# Quality gates for every pull request and for `main`, plus the production deploy
# that follows a green run on `main`. One workflow so the deploy waits for the
# exact jobs above instead of a separate `workflow_run`.
#
# The heavy jobs are skipped when a change touches only documentation (see the
# `changes` job). The `ci` job at the end always runs and fails if any job
# above failed or was cancelled, so it is the one required status check for
# this workflow: it never hangs on a docs-only pull request and never passes
# when a test failed.
#
# Workflow changes need @Rurur8 as first reviewer and @STR4T-coder as second
# reviewer; the project lead merges (docs/team.md#review-routing).

on:
  push:
    branches: [main]
  pull_request:
  # Re-run the whole pipeline on the chosen branch without a new commit. On `main`
  # this also redeploys, which is the way out when a push event never started a run.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # `code` is true when at least one changed file is outside the
      # documentation. A new file anywhere else runs the full pipeline by
      # default, so a config change can never skip the checks it affects.
      # Markdown under `src/` is site content, so only top-level and
      # `.github/` Markdown counts as documentation.
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3
        id: filter
        # A manual run has no base to compare with, so it always runs everything.
        if: github.event_name != 'workflow_dispatch'
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '!docs/**'
              - '!*.md'
              - '!.github/**/*.md'

  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check Astro and TypeScript
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  # Runs beside `quality` so the two overlap. `e2e` and `lighthouse` wait for both,
  # so a type error or a failed test stops the slow browser jobs from starting.
  build:
    name: build
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the site
        run: pnpm build
      - name: Check the site has no sample content
        run: node scripts/check-no-sample.mjs dist
      # `e2e` and `lighthouse` test this exact artifact instead of building
      # again, so what they check is what would deploy.
      - name: Upload the built site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e
    needs: [changes, quality, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          # Playwright serves the artifact above instead of rebuilding it.
          PLAYWRIGHT_SERVE_PREBUILT: '1'
          # Use the Chrome already on GitHub's Ubuntu runners (playwright.config.ts)
          # instead of downloading a browser on every run.
          PLAYWRIGHT_CHANNEL: chrome
      # Second phase: the fictional guide in examples/services/ gets a real page
      # test. This build stays inside this job and is never uploaded, so it
      # cannot deploy (ADR 0014).
      - name: Build with the sample guide
        run: pnpm build
        env:
          SAMPLE_CONTENT: 'true'
      - name: Test the sample guide page
        run: pnpm exec playwright test tests/e2e/sample.spec.ts
        env:
          SAMPLE_CONTENT: 'true'
          PLAYWRIGHT_SERVE_PREBUILT: '1'
          PLAYWRIGHT_CHANNEL: chrome
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: [changes, quality, build]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the built site
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist
      # One run per page on a pull request (the median of three is only needed on
      # `main`, which gates the deploy). The budgets are the same either way.
      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun --collect.numberOfRuns="$LHCI_RUNS"
        env:
          LHCI_RUNS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
          # Chrome is preinstalled on GitHub's Ubuntu runners.
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7

  # Known vulnerabilities in the dependencies that ship to production. Dev tools
  # are left out and only high or critical advisories fail the job, so a new
  # low-severity advisory in a build tool cannot block a merge. Renovate opens
  # the fixing pull request.
  audit:
    name: audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
        with:
          install: 'false'
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  # The required status check. When the change touches code, every job above
  # must have finished as `success`; a job that was skipped by mistake does not
  # count as a pass. When the change is documentation only, every heavy job must
  # have been skipped. A failed or cancelled job always fails `ci`.
  ci:
    name: ci
    needs: [changes, quality, audit, build, e2e, lighthouse]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the results of the jobs above
        env:
          CODE: ${{ needs.changes.outputs.code }}
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          AUDIT: ${{ needs.audit.result }}
          BUILD: ${{ needs.build.result }}
          E2E: ${{ needs.e2e.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          expected=skipped
          if [ "$CODE" = "true" ]; then expected=success; fi

          failed=0
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes finished as '$CHANGES', expected 'success'"
            failed=1
          fi
          for pair in "quality=$QUALITY" "audit=$AUDIT" "build=$BUILD" "e2e=$E2E" "lighthouse=$LIGHTHOUSE"; do
            job="${pair%%=*}"
            result="${pair#*=}"
            if [ "$result" != "$expected" ]; then
              hint=""
              if [ "$result" = "skipped" ] && [ "$QUALITY" = "failure" ]; then
                hint=" (it waits for quality, which failed: fix that first)"
              fi
              echo "::error::$job finished as '$result', expected '$expected'$hint"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "ci passed (code changed: ${CODE:-false})"

  # `ci` already requires every job above to have succeeded, so deploy waits for
  # `ci` alone and the rules live in one place. A failed or cancelled `ci` skips
  # deploy without any extra condition.
  deploy:
    name: deploy
    needs: [changes, ci]
    if: >-
      needs.ci.result == 'success' &&
      needs.changes.outputs.code == 'true' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      # Copies of this template have no default address, so a deploy without
      # PRODUCTION_URL stops here instead of checking someone else's site.
      - name: Require the PRODUCTION_URL variable
        env:
          PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$PRODUCTION_URL" ]; then
            echo "::error title=PRODUCTION_URL is not set::Set the repository variable PRODUCTION_URL to your site address (Settings, Secrets and variables, Actions, Variables). See docs/adapt-for-your-lgu.md#automatic-deploys-from-github."
            exit 1
          fi
          echo "Deploying to $PRODUCTION_URL"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Download the site CI tested
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: site
          path: dist

      - name: Check the artifact is complete
        shell: bash
        run: |
          test -s dist/index.html
          test -s dist/fil/index.html
          test -s dist/404.html
          test -d dist/pagefind

      - name: Check the site has no sample content
        run: node scripts/check-no-sample.mjs dist

      # The version that is live now, kept so a failed smoke test can go back to it.
      # If it cannot be read (the first deploy, or an API error) the deploy still
      # goes ahead and a failure is rolled back by hand.
      - name: Remember the live version
        id: previous
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          version=$(pnpm exec wrangler deployments list --json 2>/dev/null | node -e '
            let text = "";
            process.stdin.on("data", (chunk) => (text += chunk)).on("end", () => {
              try {
                // A bare array, or the API envelope ({ deployments } or { result }).
                const data = JSON.parse(text);
                const list = Array.isArray(data)
                  ? data
                  : (data.deployments ?? data.result?.deployments ?? []);
                list.sort((a, b) => String(a.created_on).localeCompare(String(b.created_on)));
                // During a gradual rollout the live deployment splits traffic between
                // versions; go back to the one serving the most.
                const versions = [...(list.at(-1)?.versions ?? [])];
                versions.sort((a, b) => (b.percentage ?? 0) - (a.percentage ?? 0));
                const id = versions[0]?.version_id;
                if (id) console.log(id);
              } catch {}
            });
          ' || true)
          if [ -z "$version" ]; then
            echo "::warning::Could not read the live version; automatic rollback is off for this deploy."
          else
            echo "Live version before this deploy: $version"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Deploy to production
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # `pnpm smoke` already retries for about 30 seconds. If it still fails, check
      # once more after a pause, so one network blip cannot undo a good deploy
      # (ADR 0012). Only a second failure rolls back. The job stays red either way
      # after a rollback, so the failed deploy is never mistaken for a good one.
      - name: Check production, and roll back if it is broken
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_URL }}
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          if pnpm smoke; then exit 0; fi

          echo "::warning::The smoke test failed. Checking again in 30 seconds."
          sleep 30
          if pnpm smoke; then
            echo "::warning::The second check passed, so there is no rollback. Look at the first failure above."
            exit 0
          fi

          if [ -z "$PREVIOUS_VERSION" ]; then
            echo "::error::Production is failing and no earlier version is known. Roll back by hand."
            exit 1
          fi

          echo "::error::Production is still failing. Rolling back to $PREVIOUS_VERSION."
          pnpm exec wrangler rollback "$PREVIOUS_VERSION" \
            --message "Automatic rollback: smoke test failed after $COMMIT_SHA" --yes
          echo "ROLLED_BACK=true" >> "$GITHUB_ENV"

          if pnpm smoke; then
            echo "::error::Rolled back to $PREVIOUS_VERSION and the earlier version is healthy. The new version is NOT live."
          else
            echo "::error::Rolled back to $PREVIOUS_VERSION but the site is still failing, so the cause is not this deploy."
          fi
          exit 1

      - name: Record the deployment
        if: always()
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          COMMIT_SHA: ${{ github.sha }}
          SITE_URL: ${{ vars.PRODUCTION_URL }}
        run: |
          {
            echo "### Production deploy"
            echo
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Site: $SITE_URL"
            echo
            echo '```text'
            pnpm exec wrangler deployments list 2>&1 | head -20
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Explain what happened and how to roll back
        if: failure()
        shell: bash
        run: |
          {
            echo "### Deploy failed"
            echo
            if [ "${ROLLED_BACK:-}" = "true" ]; then
              echo "The smoke test failed twice, so production was rolled back automatically."
              echo "The new version is not live. Read the log above before deploying again."
            else
              echo "Production may be serving a broken version, and no automatic rollback ran."
              echo "Roll back with the project lead:"
            fi
            echo
            echo '```sh'
            echo 'pnpm exec wrangler deployments list'
            echo 'pnpm exec wrangler rollback <version-id>'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
