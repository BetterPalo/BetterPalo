name: CI

# Quality gates for every pull request and for `main`. See docs/maintainers.md
# for the branch rules that make these jobs required, and ADR 0010 for the
# performance budget that Lighthouse enforces.
#
# Workflow changes need @Rurur8 as first reviewer and @STR4T-coder as second
# reviewer; the project lead merges (docs/team.md#review-routing).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a branch supersedes the run in progress for that branch.
# Runs on `main` are never cancelled, so the record of what shipped stays whole.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Check formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check Astro and TypeScript
        run: pnpm check
      - name: Unit tests
        run: pnpm test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Build the site
        run: pnpm build
      # `e2e` and `lighthouse` test this exact artifact instead of building
      # again, so what they check is what would deploy.
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist/
          if-no-files-found: error
          retention-days: 7

  e2e:
    name: e2e
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Install the test browser
        run: pnpm exec playwright install --with-deps chromium
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Run end-to-end tests
        run: pnpm test:e2e
        env:
          # Playwright serves the artifact above instead of rebuilding it.
          PLAYWRIGHT_SERVE_PREBUILT: '1'
      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  lighthouse:
    name: lighthouse
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Run Lighthouse CI
        run: pnpm exec lhci autorun
        env:
          # Chrome is preinstalled on GitHub's Ubuntu runners.
          CHROME_PATH: /usr/bin/google-chrome
      - name: Upload the Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: ignore
          retention-days: 7
