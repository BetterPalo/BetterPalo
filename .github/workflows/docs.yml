name: Docs

# Markdown lint and link check on every pull request and on `main`. It runs on
# every change, not only documentation changes: it takes seconds, and a code
# change that renames or moves a file can break a link in the docs.
#
# Workflow changes need @Rurur8 as first reviewer and @STR4T-coder as second
# reviewer; the project lead merges (docs/team.md#review-routing).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25
        with:
          globs: '**/*.md'

      - name: Check relative links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md'
