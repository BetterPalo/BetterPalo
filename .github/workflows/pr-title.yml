name: PR title

# Squash merge makes the pull request title the one commit on main, so the
# title must be a conventional commit. See CONTRIBUTING.md#commit-messages.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - name: Check the title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|docs|data|content|i18n|style|refactor|test|ci|chore)(\([a-z0-9/,-]+\))?!?: [a-z].+$'
          if ! [[ "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must be a conventional commit, for example 'feat(services): add cedula guide'. Got: $TITLE"
            exit 1
          fi
          if [ "${#TITLE}" -gt 72 ]; then
            echo "::warning::PR title is ${#TITLE} characters; keep it under 72, because it becomes the commit subject on main."
          fi
