id: macarthur-landing-memorial-national-park
name: MacArthur Landing Memorial National Park
categories: [heritage]
description: >
  The most significant landmark in Palo, a 6.78-hectare protected area in
  Candahug village facing Leyte Gulf. It features seven double-life-size bronze
  statues in a man-made pool, depicting General Douglas MacArthur’s historic
  return on October 20, 1944. The park was declared a national park in 1977 and
  is a major tourist attraction in Eastern Visayas.
