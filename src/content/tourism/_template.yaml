# Copy this file to <id>.yaml (for example macarthur-landing-memorial.yaml) and fill it in.
# null means "the official source does not say". Never guess.
# Ported from the Palo Tourism Portal. A spot shows an "unverified" badge until
# source, retrieved, verified_by, and last_verified are filled and status is verified.
id: example-spot
name: Example Spot
# One of: historical, eco, cultural (see src/lib/schemas/tourism.ts).
category: historical
description: >
  One or two plain-language sentences about the place.
address: null
offer: null
# Use an original photo or one with permission recorded in docs/data-sources.md.
# A photo needs image_alt; otherwise keep both fields null.
image: null
image_alt: null

source: null
edition: null
retrieved: null
verified_by: null
last_verified: null
status: needs_confirmation
