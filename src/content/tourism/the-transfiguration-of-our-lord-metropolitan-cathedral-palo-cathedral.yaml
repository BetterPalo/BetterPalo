name: The Transfiguration of Our Lord Metropolitan Cathedral (Palo Cathedral)
categories: [church]
description: >
  A Level II historical landmark constructed in 1596 under the Jesuits, later
  taken over by Augustinians (1768) and Franciscans (1843). It was used as a
  hospital by American liberation forces from October 1944 to March 1945 and
  houses a historic Kimball Pipe Organ.
