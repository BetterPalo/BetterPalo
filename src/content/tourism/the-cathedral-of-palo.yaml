id: the-cathedral-of-palo
name: The Cathedral of Palo
categories: [heritage]
description: >
  A national historical landmark (Level II, marker installed 1954). Constructed
  in 1596 by the Jesuits, it was later run by Augustinians and Franciscans. It
  was proclaimed a cathedral on March 25, 1938, and served as a hospital for
  American forces in 1944–1945.
