# Transcribed from the Palo Citizen's Charter 2026 (2nd Edition), PDF pages 205-207.
# Unverified: needs a second checker before status becomes verified.
id: pwd-id-ra-9442
name: Application of PWD ID (in compliance with RA 9442)
category: Social welfare
office: Office of the Municipal Social Welfare and Development (MSWDO)
classification: simple
transaction_type: G2C – Government to the Transacting Public
description: >
  The PWD ID issuance is pursuant to Republic Act No. 9442 as amendment to
  Republic Act 7277, otherwise known as the Magna Carta for Disabled Persons
  and For Other Purposes. These guidelines serve as the mechanism for the
  issuance of Persons with Disability Identification Cards. It aims to provide
  PWDs the opportunity to take part in society by granting them a 20% discount
  and exemption from the value-added tax on certain commodities.
eligibility: Citizens with disabilities.
requirements:
  - document: Registration Form (duly filled up), certified by the Punong Barangay as to residency for 6 months or more in the barangay and certified by a physician as to the client's disability
    copies: 1
    form: original
    where_to_get: MSWDO
    conditions: null
  - document: 2 copies of 1x1 ID picture
    copies: 2
    form: null
    where_to_get: Applicant
    conditions: null
steps:
  - step: 1
    applicant_action: >
      Request the service from the MSWDO.
    office_action: >
      1.1 Get initial information from the client. 1.2 Request the client to
      fill up the registration form and validate the information through a
      personal interview. 1.3 Request the client to submit the required
      documents. 1.4 Prepare the ID for signature of the authorized officer.
    responsible: Staff, MSWDO
    max_time: 1 day
  - step: 2
    applicant_action: >
      Submit the required documents.
    office_action: >
      Prepare and release the PWD ID.
    responsible: Staff, MSWDO
    max_time: 1 week (7 days)
fees:
  - amount: None
    purpose: PWD ID issuance
    where_to_pay: null
    conditions: null
    basis: null
processing_time: 1 week (7 days)
application_channels:
  - type: walk-in
    url: null
    location: Office of the Municipal Social Welfare and Development (MSWDO)
    supports: null
    account_required: null
    last_tested: null
complaint_procedure: >
  Redress for complaints may be addressed in the office concerned at the lowest
  possible level, if not resolved, to the immediate supervisor or to the
  Municipal Mayor or to other concerned offices which have jurisdiction over the
  complaint. You may visit the Administrative Office and secure a complaint
  form, fill up the same and submit to the said office for immediate and prompt
  action. A complaint form is available at the Administrative Office wherein the
  client states his/her specific complaint. Feedback form is dropped in a
  Suggestion Box located in conspicuous places of the Municipal Building.
  Contact information of CCB, PCC, ARTA - ARTA - complaints@arta.gov.ph, 1-ARTA
  (2782); PCC - 8888; CCB - 0908-881-6565 (SMS).
effective_date: null
notes: >
