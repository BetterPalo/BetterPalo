# Transcribed from the Palo Citizen's Charter 2026 (2nd Edition), PDF pages 205-208
# and 255.
# Unverified: needs a second checker before status becomes verified.
id: pwd-id-ra-9442
name: Application of PWD ID (in compliance with RA 9442)
category: social-welfare
office: Office of the Municipal Social Welfare & Development Officer
classification: simple
transaction_type: G2C – Government to the Transacting Public
description: >
  The PWD ID issuance is pursuant to Republic Act No. 9442 as amendment to
  Republic Act 7277, otherwise known as the Magna Carta for Disabled Persons
  and For Other Purposes. These guidelines serve as the mechanism for the
  issuance of Persons with Disability Identification Cards. It aims to provide
  PWDs the opportunity to take part in society by granting them 20% discount
  and exemption from the value-added commodities.
eligibility: Citizen
requirements:
  - document: Registration Form (duly filled up), certified by the Punong Barangay as to residency for 6 months or more in the Barangay and certified by a physician as to client's disability
    copies: null
    form: null
    where_to_get: MSWDO
    conditions: null
  - document: 2 copies of 1x1 ID picture
    copies: 2
    form: null
    where_to_get: Applicant
    conditions: null
steps:
  - step: 1
    applicant_action: >
      1. Client requests for the service
    office_action: >
      1.1. Get initial information from the client. 1.2. Request the client to
      fill up the registration form and validate information through personal
      interview. 1.3. Request the client to submit required documents. 1.4.
      Prepare ID for signature of MSWDO. 1.5. MSWDO signs PWD ID. 1.6. Signed
      PWD ID for recording in out-going logbook and submit for barcoding and
      signature of Local Chief Executive (LCE). 1.7. PWD ID signed by LCE
      received by DTS in-charge. 1.8. Forward PWD IDs to Persons with
      Disability Affairs Office (PDAO) Focal Person for release to PWD
      applicants.
    responsible: Staff, MSWDO; MSWDO (step 1.5)
    max_time: 5 minutes (1.1); 15 minutes (1.2); 1 day (1.3); 1 week (7 days) (1.4); 2 minutes (1.5); 5 minutes (1.6); 5 minutes (1.7); 5 minutes (1.8)
  - step: 2
    applicant_action: >
      2. Client receives PWD ID
    office_action: >
      2.1. Release PWD ID to PWD ID applicants
    responsible: Staff, MSWDO
    max_time: 5 minutes
  - step: 3
    applicant_action: >
      3 Issuance of PWD Certification
    office_action: >
      3.1 Request and issuance of PWD Certification
    responsible: MSWDO
    max_time: 5 minutes
fees:
  - amount: None
    purpose: null
    where_to_pay: null
    conditions: null
    basis: null
processing_time: 8 days, 1 hour and 24 minutes
application_channels:
  - type: walk-in
    url: null
    location: Office of the Municipal Social Welfare and Development (MSWDO)
    supports: null
    account_required: null
    last_tested: null
complaint_procedure: >
  Redress for complaints may be addressed in the office concerned at the lowest
  possible level, if not resolved, to the immediate supervisor or to the
  Municipal Mayor or to other concerned offices which have jurisdiction over the
  complaint. At the LGU's levels, immediate action is assured. You may visit the
  Administrative Office and secure a complaint form, fill up the same and submit to the said office for immediate and prompt
  action. A complaint form is available at the Administrative Office wherein the
  client states his/her specific complaint. Feedback form is dropped in a
  Suggestion Box located in conspicuous places of the Municipal Building.
  Contact information of CCB, PCC, ARTA - ARTA - complaints@arta.gov.ph, 1-ARTA
  (2782); PCC - 8888; CCB - 0908-881-6565 (SMS).
effective_date: null
notes: >
  Transcribed from PDF pages 205-208 (the PWD ID section, service G; the same
  pages also contain the referral for adoption service and service H). The
  Charter lists individual staff names for each step; they are left out and
  "responsible" shows office and position only. The Charter's sub-steps 1.1 to
  1.8 are combined into step 1, each keeping its own time in max_time. The fees
  column says "None" for every step, copied as printed. The Charter's total is
  "8 days, 1 hour and 24 minutes" (page 208), copied as printed; the step times
  add up to 8 days and 47 minutes. The Charter's approval date has not been
  confirmed by the LGU.
