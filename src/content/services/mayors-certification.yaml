# Transcribed from the Palo Citizen's Charter 2026 (2nd Edition), PDF pages 13-14 and 255.
# Checked against the PDF by the lead (Zyxavy); verified 2026-11-24.
id: mayors-certification
name: Provision of Mayor’s Certification
category: certifications
office: Administrative & Human Resource Management Section
classification: simple
transaction_type: G2C – Government to Citizen
description: >
  This document, usually required by employers and other institutions,
  certifies that the client is of good standing in the community.
eligibility: Residents of Palo
requirements:
  - document: >
      Police Clearance. Bring the original copy of the Police Clearance for
      verification purposes.
    copies: 1
    form: photocopy
    where_to_get: Palo Municipal Police Station
    conditions: null
  - document: >
      Barangay Clearance for Employment. If first time jobseeker, please
      specify in the clearance.
    copies: 1
    form: photocopy
    where_to_get: Barangay Hall concerned
    conditions: null
  - document: Cedula - Community Tax Certificate (CTC)
    copies: 1
    form: photocopy
    where_to_get: Barangay Hall concerned / Windows 1 – 4, Office of the Municipal Treasurer
    conditions: null
  - document: Payment of Certification Fee (Original Copy of the Receipt)
    copies: null
    form: original
    where_to_get: Windows 1 – 4, Office of the Municipal Treasurer
    conditions: null
  - document: One (1) Documentary Stamp for every requested Certification (if available)
    copies: 1
    form: null
    where_to_get: Bureau of Internal Revenue (BIR)
    conditions: null
  - document: Valid Identification Card
    copies: 1
    form: photocopy
    where_to_get: Client (National ID, if none, any Valid ID)
    conditions: null
steps:
  - step: 1
    applicant_action: >
      1. Client inquires how to avail the service.
    office_action: >
      1. Inform and give the client a checklist of requirements.
    responsible: Administrative Aide I
    max_time: 30 minutes
  - step: 2
    applicant_action: >
      2. Submit the required documents to the Office of the Mayor – Counter 1
      for initial assessment and verification. *Secure Order of Payment.
    office_action: >
      2.1 Receive the required documents and check for completeness. 2.2 Issue
      Order of Payment if required documents are complete.
    responsible: Administrative Aide I (2.1); Administrative Staff (2.2)
    max_time: 30 minutes
  - step: 3
    applicant_action: >
      3. Pay required fees at the Office of the Municipal Treasurer – Window 1-4
      by showing the Order of Payment. *Secure Official Receipt.
    office_action: >
      3. Upon Payment of all fees required, issue Official Receipt.
    responsible: Windows 1 – 4, Office of the Municipal Treasurer
    max_time: 30 minutes
  - step: 4
    applicant_action: >
      4. Return to the Office of the Mayor – Counter 1 for the processing of the
      certification.
    office_action: >
      4.1 Prepare the Certification for signature of the Local Chief Executive.
      4.2 Sign the Certification.
    responsible: Administrative Aide VI (4.1); Local Chief Executive (4.2)
    max_time: 2 hours (4.1); 3 hours (4.2)
  - step: 5
    applicant_action: >
      5. Receives Certification at the Office of the Mayor – Counter 2.
    office_action: >
      5. Segregate documents and release certification.
    responsible: Administrative Staff
    max_time: 1 hour
fees:
  - amount: PHP 100.00
    purpose: Certification fee
    where_to_pay: Office of the Municipal Treasurer, Windows 1-4
    conditions: >
      May vary with or without documentary stamp or a first time job seeker,
      as printed under the Charter's TOTAL (PHP 130.00); see notes.
    basis: null
processing_time: 7 Hours and 15 minutes
application_channels:
  - type: walk-in
    url: null
    location: Office of the Mayor (Administrative Office)
    supports: null
    account_required: null
    last_tested: null
complaint_procedure: >
  Redress for complaints may be addressed in the office concerned at the lowest
  possible level, if not resolved, to the immediate supervisor or to the
  Municipal Mayor or to other concerned offices which have jurisdiction over the
  complaint. At the LGU's levels, immediate action is assured. You may visit the
  Administrative Office and secure a complaint form, fill up the same and submit to the said office for immediate and prompt
  action. A complaint form is available at the Administrative Office wherein the
  client states his/her specific complaint. Feedback form is dropped in a
  Suggestion Box located in conspicuous places of the Municipal Building.
  Contact information of CCB, PCC, ARTA - ARTA - complaints@arta.gov.ph, 1-ARTA
  (2782); PCC - 8888; CCB - 0908-881-6565 (SMS).
effective_date: null
notes: >
  Transcribed from PDF pages 13-14 (service B, Provision of Mayor's
  Certification) and 255 (Feedback and Complaint Mechanism); printed page
  numbers are the same as the PDF page numbers. The step table was read from
  the page images because the text layer mixes up the columns. The Charter
  lists a named staff member for each step; the names are left out, and
  "responsible" shows the position only. The Charter's office is "Office of
  the Mayor (Administrative Office)" (p. 13); the office field uses the name
  in offices.yaml. Steps 2 and 4 combine sub-steps: step 2 has one time (30
  minutes) for sub-steps 2.1 and 2.2, and step 4 lists its two times in
  max_time. The Charter prints the certification fee as PHP 100.00 at step 3
  (p. 14) and as a TOTAL of PHP 130.00, which may vary with or without
  documentary stamp or a first time job seeker (p. 14). Both are copied as
  printed and not reconciled; the Charter does not explain the difference. The
  Charter's total is "7 Hours and 15 minutes" (p. 14), copied as printed; the
  step times add up to 7 hours and 30 minutes (30 minutes, 30 minutes, 30
  minutes, 2 hours, 3 hours and 1 hour). The Charter lists one Documentary
  Stamp for every requested certification, if available, from the Bureau of
  Internal Revenue (p. 13) as a requirement; no amount is printed, so it is not
  listed as a fee. The Charter gives no number of copies for the Payment of
  Certification Fee (Original Copy of the Receipt) requirement, so copies is
  null. Barangay Hall concerned and Windows 1-4 are both printed as places to
  secure the Cedula (CTC).

