# Transcribed from the Palo Citizen's Charter 2026 (2nd Edition), PDF pages 21-24.
# Unverified: needs a second checker before status becomes verified.
id: new-and-renewal-of-business-permits
name: Granting of New and Renewal of Existing Business Permits
category: Business permits
office: Business Permits and Licensing Office
classification: complex
transaction_type: G2C – Government to the Transacting Public
description: >
  All businesses are required to secure a Business License and Mayor's Permit
  prior to operating a new business or to continue operating an existing
  business. The Business Permit and Licensing Section of the Municipal Mayor's
  Office facilitates the renewal of business permits; an Electronic-Business-
  One-Stop-Shop (EBOSS) is set up at the Municipal Hall and is operated for
  the whole year round.
eligibility: >
  Any citizen doing business or planning to do business within the Municipality
  of Palo, Leyte.
requirements:
  - document: Application Form for New/Renewal of Business Permit
    copies: 1
    form: original
    where_to_get: Business Permits and Licensing Office (BPLO)
    conditions: null
  - document: Barangay Business Clearance or Barangay Business Clearance Approval Slip
    copies: 1
    form: photocopy
    where_to_get: Concerned Barangay / Office of the Municipal Treasurer
    conditions: null
  - document: Community Tax Certificate
    copies: 1
    form: photocopy
    where_to_get: Office of the Municipal Treasurer
    conditions: null
  - document: Certificate of Registration from DTI (if sole proprietorship)
    copies: 1
    form: photocopy
    where_to_get: Department of Trade and Industry (DTI)
    conditions: If sole proprietorship.
  - document: Certificate of Incorporation from SEC (if corporation)
    copies: 1
    form: photocopy
    where_to_get: Securities and Exchange Commission (SEC)
    conditions: If corporation.
  - document: Certificate of Registration from CDA (if cooperative)
    copies: 1
    form: photocopy
    where_to_get: Cooperative Development Authority (CDA)
    conditions: If cooperative.
  - document: Notarized Sworn Statement
    copies: 1
    form: original
    where_to_get: BPLO and Notary Public
    conditions: null
  - document: Sanitary Permit
    copies: 1
    form: photocopy
    where_to_get: Office of the Municipal Health Officer (MHO)
    conditions: null
  - document: Health Card (food and non-food related business)
    copies: 1
    form: photocopy
    where_to_get: Office of the Municipal Health Officer (MHO)
    conditions: null
  - document: Local Fire Assessment for New Business
    copies: 1
    form: original
    where_to_get: Business Permits and Licensing Office (BPLO)
    conditions: For new business.
  - document: Notarized Affidavit of Undertaking (for engineering requirements)
    copies: 1
    form: original
    where_to_get: Business Permits and Licensing Office (BPLO)
    conditions: null
  - document: Fire Safety Inspection Certificate (FSIC) for renewal of business
    copies: 1
    form: original
    where_to_get: Bureau of Fire Protection (Palo - BFP)
    conditions: For renewal of business.
  - document: After Inspection Report (AIR) for renewal of business
    copies: 1
    form: original
    where_to_get: Bureau of Fire Protection (Palo - BFP)
    conditions: For renewal of business.
  - document: Special Power of Attorney (SPA), if representative
    copies: 1
    form: original
    where_to_get: Notary Public
    conditions: If representative.
  - document: Proof of ownership (land title, tax declaration, or contract of lease)
    copies: 1
    form: photocopy
    where_to_get: Office of the Municipal Assessor (MASSO) / property owner
    conditions: null
  - document: Occupancy Permit
    copies: 1
    form: photocopy
    where_to_get: Office of the Municipal Engineer (MEO)
    conditions: Secondary requirement.
  - document: Building Permit
    copies: 1
    form: photocopy
    where_to_get: Office of the Municipal Engineer (MEO)
    conditions: Secondary requirement.
  - document: Lessor's Business Permit (if the business establishment is rented)
    copies: 1
    form: photocopy
    where_to_get: Lessor / property owner
    conditions: If rented.
  - document: Property holdings and tax payments
    copies: 1
    form: original
    where_to_get: Office of the Municipal Assessor (MASSO)
    conditions: null
  - document: Other requirements as may be appropriate
    copies: 1
    form: photocopy
    where_to_get: >
      Office of the Municipal Health Officer (MHO), Department of Energy (DOE),
      Philippine National Police (Palo - PNP), Department of Labor and Employment
      (DOLE), Bangko Sentral ng Pilipinas (BSP), Department of Environment and
      Natural Resources (DENR), Food and Drug Administration (FDA), Department of
      Agriculture (DA), Video Regulatory Board / Optical Media Board, Land
      Transportation Franchising and Regulatory Board (LTFRB), Philippine
      Contractors Accreditation Board (PCAB), Bureau of Internal Revenue (BIR),
      and the concerned barangay and Sangguniang Bayan, depending on the business
    conditions: >
      Includes, among others: certificate of potability for water refilling
      stations; certificate of compliance to operate for gasoline and LPG dealers;
      affidavit of undertaking and police certification for entertainment and
      videoke bars; clearance for recruitment agencies; clearances for banks and
      lending institutions; environmental clearance certificates; license to
      operate for pharmaceutical stores; license for insecticide and pest control
      services; permits for video rental, rent-a-car and transport services;
      PCSUCIA national license for security agencies; approved barangay and
      Sangguniang Bayan resolutions for wet markets, firing/shooting ranges, and
      billiard halls; PCAB license for contractors; and other documents on a
      case-to-case basis (e.g., income tax returns of the previous year).
steps:
  - step: 1
    applicant_action: >
      Fill out all information and upload all necessary requirements to the
      Electronic Business Permit and Licensing Online System through
      https://bpbc4.ibpls.com/paloleyte/.
    office_action: >
      1.1 Check completeness of documents. 1.2 Encode and upload all necessary
      requirements. 1.3 Verify the application. 1.4 Endorsement of the verified
      application. 1.5 Issue the Tax Order of Payment.
    responsible: BPLO staff
    max_time: 35 minutes
  - step: 2
    applicant_action: >
      Schedule a Local Fire Assessment (new business).
    office_action: >
      Conduct an inspection and assessment on the business establishment.
    responsible: BPLO staff
    max_time: 30 minutes
  - step: 3
    applicant_action: >
      Payment / validated payment (if online).
    office_action: >
      3.1 Receive payment of taxes, fees, and charges, and issue the
      corresponding official receipts. 4. Prepare, print, and have the Business
      Permit signed by the Officer-in-Charge and the Local Chief Executive.
    responsible: >
      Municipal Treasurer's Office (Windows 1-4); BPLO staff
    max_time: 15 minutes
  - step: 4
    applicant_action: >
      Submit a photocopy of the receipt, the assessment, and property holdings
      to the Business Permit and Licensing Office.
    office_action: >
      Prepare, print, and have the Business Permit signed by the
      Officer-in-Charge and the Local Chief Executive.
    responsible: BPLO staff
    max_time: 1 day
  - step: 5
    applicant_action: >
      Claim the Business Permit. Submit a photocopy of the official receipts
      and a Special Power of Attorney (if representative) upon release of the
      Business Permit.
    office_action: >
      Release the Business Permit.
    responsible: BPLO staff
    max_time: 5 minutes
