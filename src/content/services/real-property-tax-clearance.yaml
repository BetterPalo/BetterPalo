id: real-property-tax-clearance
name: Issuance of Real Property Tax Clearance and/or Certification
category: taxes
office: Office of the Municipal Treasurer
classification: simple
transaction_type: G2C – government to the transacting public
description: >
  Any individual or his/her representative who has property holdings in the
  municipality and wishes to secure a Real Property Tax Clearance and/or
  Certification for whatever purpose it may serve him/her. The Real Property
  Records Section of the Office of the Municipal Treasurer (MTO) facilitates
  the process any time during office hours.
eligibility: Any citizen who plans to secure a property clearance and or Certification.
