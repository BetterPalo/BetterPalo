steps:
  - step: 1
    applicant_action: >
      1. Make clarificatory inquiries.
    office_action: >
      1. Provide the client with a short briefing on the service and its
      requirements.
    responsible: >
      Admin Aide III, Office of the Municipal Treasurer (MTO Window 08)
    max_time: 2 minutes
  - step: 2
    applicant_action: >
      2. Proceed to the teller/RCC to pay for the Fees & Charges.
    office_action: >
      2. Issue OR
    responsible: >
      Revenue Collection Clerk 1 (MTO Windows 1, 3 and 4) and Ticket Checker (MTO
      Window 2), Office of the Municipal Treasurer
    max_time: 5 minutes
  - step: 3
    applicant_action: >
      3. Present OR to Window 7, 8 or 10 of MTO.
    office_action: >
      3. Prepare Tax Clearance/Certification
    responsible: >
      Admin Aide III, Office of the Municipal Treasurer (MTO Window 8)
    max_time: 5 minutes
  - step: 4
    applicant_action: >
      4. Receive approved clearances.
    office_action: >
      4. Segregate file copy, record date, release client's copy to the applicant
    responsible: >
      Admin Aide III, Office of the Municipal Treasurer (MTO Window 8)
    max_time: 2 minutes
