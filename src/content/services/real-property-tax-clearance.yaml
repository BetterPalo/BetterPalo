complaint_procedure: >
  Redress for complaints may be addressed in the office concerned at the lowest
  possible level, if not resolved, to the immediate supervisor or to the
  Municipal Mayor or to other concerned offices which have jurisdiction over the
  complaint. At the LGU's levels, immediate action is assured. You may visit the
  Administrative Office and secure a complaint form, fill up the same and submit to the said office for immediate and prompt
  action. A complaint form is available at the Administrative Office wherein the
  client states his/her specific complaint. Feedback form is dropped in a
  Suggestion Box located in conspicuous places of the Municipal Building.
  Contact information of CCB, PCC, ARTA - ARTA - complaints@arta.gov.ph, 1-ARTA
  (2782); PCC - 8888; CCB - 0908-881-6565 (SMS).
effective_date: null
notes: >
  Transcribed
  from PDF pages 228, 229 and 230 (service C, Issuance of Real Property Tax
  Clearance and/or Certification) and 255 (Feedback and Complaint Mechanism);
  printed page numbers are the same as the PDF page numbers. The client steps
  table (pages 229 and 230) was read from page images, because the text layer
  mixes its columns. The Charter lists individual staff names for each step;
  they are left out and "responsible" shows office and position only. The
  Charter prints four checklists, one for each purpose ("For Electrical &
  Water connection", "For Land Transfer", "For any other purposes" and "For
  Certification"); each is kept as its own group in "conditions", with its
  items and where-to-secure cells as printed. The Charter prints no number of
  copies for any checklist item; the "Photocopy of Deed of Sale or
  Adjudication" is recorded as form photocopy, and every other form is left
  null. The documentary stamp (DST) item carries an asterisk on page 228, and
  the footnote printed on page 230 reads: "Acceptance of payment for the DST
  and usage of Constructive Affixture of DST as proof of payment of DST for
  certificates issued by Government Agencies or Instrumentalities based of
  Revenue Regulation no. 2-2023 dated March 29, 2023." The Charter prints no
  amount for the DST. The fee of P100.00 per copy is printed at client step 2
  (page 229) and copied as printed; the Charter does not say what the copies
  are. The fees column says None for steps 1, 3 and 4. The Charter's total is
  "14 minutes" (page 230), copied as printed; the step times (2, 5, 5 and 2
  minutes) add up to 14 minutes, so they match.

