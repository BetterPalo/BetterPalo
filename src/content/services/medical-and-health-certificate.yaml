notes: >
  Transcribed from PDF pages 145-147 and 255 (Feedback and Complaint Mechanism);
  printed page numbers are the same as the PDF page numbers. The step table is on
  pages 146 and 147 and was read from page images. The Charter's office (page 146)
  is the same as the office above.
  The Charter names a staff member for each step; those names are left out. The
  responsible column gives the office with the position named in the step text:
  Clerk (step 1), Med. Tech. (step 2), Physician (step 6), RSI (step 7, with S.I. 1
  taken from the name cell), and MHO for the Municipal Health Officer (step 8).
  Two positions are inferred, not printed in the step text: steps 3 and 5 give
  Med. Tech. / RadTech because the name cells there carry the RMT and RRT
  credentials and step 2 names the Med. Tech. Step 4 has no person printed, so
  responsible is null.
  The Charter's sub-steps of steps 3 to 5 are not numbered; step 5 lists its nine
  printed items in order, each with its time in max_time.
  Both checklists are kept: Medical Certification (items 1 to 8) and Health
  Certification for business establishments (items 1 to 6). Each requirement
  carries its checklist heading as conditions. In the medical list, the WHERE TO
  SECURE entry "Hospital/ RHU/ Private Laboratory/ Clinic" is printed beside item 1
  with no line before item 7, so it is applied to items 1 to 6. In the health list,
  "MTO/ Barangay" and "RHU/ Private Laboratory/Clinic" sit beside items 3 and 4 with
  no lines between items, so the layout does not show which item each applies to
  and where_to_get is null for all six.
  The fee column prints None for steps 1, 2 and 4 to 7 and is blank for steps 3 and
  8. The Charter prints no amount for the laboratory tests and does not say where
  they are paid. No copies or forms are printed for any requirement.
  The step times add up to 1 day, 6 hours and 53 minutes (1,853 minutes), the same
  as the printed TOTAL on page 147.

