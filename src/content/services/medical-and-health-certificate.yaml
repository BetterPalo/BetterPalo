steps:
  - step: 1
    applicant_action: >
      1. Proceed to frontline desk for registration, taking vital signs and priority
      number.
    office_action: >
      1.1 Clerk provides priority number and take vital signs.
    responsible: Clerk, Office of the Municipal Health Officer
    max_time: 10 minutes
  - step: 2
    applicant_action: >
      2. Present the laboratory/radiologic request to the Med. Tech./RadTech.
    office_action: >
      2.1 Med. Tech. provides the client short briefing.
    responsible: Med. Tech. / RadTech, Office of the Municipal Health Officer
    max_time: 10 minutes
  - step: 3
    applicant_action: >
      3. Follow instructions for specimen collection and submit specimen.
    office_action: Receive and examine specimen.
    responsible: Med. Tech. / RadTech, Office of the Municipal Health Officer
    max_time: 2 hours
  - step: 4
    applicant_action: >
      4. Take note of the date of release of the results.
    office_action: Sputum examination; CBC and platelet count.
    responsible: null
    max_time: 24 hours
  - step: 5
    applicant_action: >
      5. Get laboratory/radiologic results.
    office_action: >
      CBC and platelet count; Blood Typing; Blood Sugar; HBS Ag Test/RPR; Urinalysis;
      Pregnancy Test; Stool Exam; Gram Staining/Xray & ultrasound; Give results to
      patient and advise to proceed to MHO for assessment of result.
    responsible: Med. Tech. / RadTech, Office of the Municipal Health Officer
    max_time: >
      1 hour (CBC and platelet count); 10 minutes (Blood Typing); 10 minutes (Blood
      Sugar); 10 minutes (HBS Ag Test/RPR); 30 minutes (Urinalysis); 30 minutes
      (Pregnancy Test); 20 minutes (Stool Exam); 40 minutes (Gram Staining/Xray &
      ultrasound); 40 minutes (give results to patient)
  - step: 6
    applicant_action: >
      6. Proceed to the Municipal Health Officer and submit the laboratory/radiologic
      results required for medical certification.
    office_action: >
      Physician reviews laboratory results, performs medical evaluation if necessary,
      and prepares the medical certificate.
    responsible: Physician, Office of the Municipal Health Officer
    max_time: 10 minutes
  - step: 7
    applicant_action: >
      7. Proceed to the assigned RSI and submit the laboratory result for health card
      recording.
    office_action: >
      RSI records the health certificate and updates the health card record when
      applicable.
    responsible: Rural Sanitary Inspector (S.I. 1), Office of the Municipal Health Officer
    max_time: 10 minutes
  - step: 8
    applicant_action: >
      8. Receive certification.
    office_action: Give health certificate to MHO for signature.
    responsible: Municipal Health Officer
    max_time: 3 minutes
