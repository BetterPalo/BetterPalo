id: medical-and-health-certificate
name: Provision of Issuance of Medical and Health Certificate
category: health
office: Office of the Municipal Health Officer
classification: simple
transaction_type: G2C – government to the transacting public
description: >
  Various firms, schools, and government agencies may require individuals to
  secure Medical or Health Certificates as part of their application or compliance
  requirements. This is commonly required for individuals applying for a driver’s
  license with the Land Transportation Office (LTO), employment applicants,
  students enrolling in educational institutions, and individuals applying for or
  renewing a business permit. The Office of the Municipal Health Officer provides
  the issuance of the following certificates: a. Medical Certificate – A
  certification issued to an individual after medical evaluation indicating that
  the person is physically fit or medically cleared for a specific purpose. b.
  Health Certificate – A certification issued to individuals, particularly food
  handlers and business workers, as part of the requirements for securing or
  renewing a business permit. Medical and Health Certificates are issued by the
  Office of the Municipal Health Officer after proper medical assessment and
  evaluation.
eligibility: All interested parties requesting for medical certification.
