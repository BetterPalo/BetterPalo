complaint_procedure: >
  Redress for complaints may be addressed in the office concerned at the lowest
  possible level, if not resolved, to the immediate supervisor or to the
  Municipal Mayor or to other concerned offices which have jurisdiction over the
  complaint. At the LGU's levels, immediate action is assured. You may visit the
  Administrative Office and secure a complaint form, fill up the same and submit to the said office for immediate and prompt
  action. A complaint form is available at the Administrative Office wherein the
  client states his/her specific complaint. Feedback form is dropped in a
  Suggestion Box located in conspicuous places of the Municipal Building.
  Contact information of CCB, PCC, ARTA - ARTA - complaints@arta.gov.ph, 1-ARTA
  (2782); PCC - 8888; CCB - 0908-881-6565 (SMS).
effective_date: null
notes: >
  The Charter's approval date has not been confirmed by the LGU.
  Transcribed from PDF pages 21 to 24 (service A only; page 24 also starts service
  B, Motorcab Franchise, which is left out) and page 255 (Feedback and Complaint
  Mechanism). Printed page numbers are the same as the PDF page numbers. Steps 1
  and 2 are on page 23; steps 3 to 5 and the TOTAL are on page 24. The steps table
  was read from page images. The TOTAL is copied as printed; it equals the five
  step times added up.
  The Charter lists the person responsible for each step by individual staff
  name (page 23). Those names are left out; "responsible" shows "BPLO Staff" and
  the endorsing offices only.
  Each step combines the Charter's sub-steps (1.1 to 1.5, 2.1, 3.1) into one
  entry. The Charter labels step 2 "(New)" and step 3 "(if online)"; both labels
  are kept as printed.
  Step 1 names the Electronic Business Permit and Licensing System (BPLS) and
  prints its web address (page 23), which is recorded as the online channel. The
  lead decided on 2026-11-19 to list it. What was tested: both iBPLS hosts
  (bpbc.ibpls.com and bpbc4.ibpls.com) serve the same Palo system, and an account
  can be registered online. No business permit transaction has been tried, so it
  is not confirmed which transactions complete online end to end (see
  docs/data-sources.md, BPLS caution).
  Fees: the only fee the Charter states is in step 3 (page 24), "Based on the
  Municipal Tax and Revenue Code of 2022 of the Municipality of Palo, Province of
  Leyte". The Charter gives no amount, so amount is null and the code is recorded
  in basis. Steps 1, 2, 4 and 5 show "None" in the fees column and are not listed.
  Requirements are in three groups: Primary (page 21 to 22, items 1 to 15),
  Secondary (page 22, items 1 to 4) and Other requirements as may be appropriate
  (page 22 to 23, items a to q). The Charter gives "1 photocopy" once, in the Other
  group header (page 22); it is applied to each item in that group, and the
  per-item copies and forms are otherwise not stated. Where to get is copied as
  printed; no web addresses are added. The Charter's spelling is kept, for example
  "Proof of Owner Ship" and "if the business establishment id rented".
  The page 21 introduction mentions an Electronic-Business-One-Stop-Shop (EBOSS)
  at the Municipal Hall and a "Business Permit and Licensing Section of the
  Municipal Mayor's Office" for renewals. Neither is recorded as a channel or as
  the office, which is the "Office or Division" line on page 21. The Charter gives
  no street address for the BPLO.
  Complaint procedure (page 255): the Charter-wide text, the same in every guide.

