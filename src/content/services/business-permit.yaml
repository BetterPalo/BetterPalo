# Transcribed from the Palo Citizen's Charter 2026 (2nd Edition), PDF pages 21-24 and 255.
# Checked against the PDF by the lead (Zyxavy); verified 2026-11-20.
id: business-permit
name: Granting of New and Renewal of Existing Business Permits
category: business
office: Business Permits & Licensing Office
classification: complex
transaction_type: G2C – Government to the Transacting Public
description: >
  All businesses in the Municipality of Palo are required to secure a Business
  License and Mayor's Permit before operating a new business or to continue
  operating an existing one. This service covers granting new business permits
  and renewing existing ones.
eligibility: Any citizen doing business or plan to do business within the Municipality of Palo, Leyte.
