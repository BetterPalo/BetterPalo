steps:
  - step: 1
    applicant_action: >
      1. Fill out all information and upload all necessary requirement to our
      Electronic Business Permit and Licensing System thru:
      https://bpbc4.ibpls.com/paloleyte/
    office_action: >
      1.1 Check completeness of documents. 1.2 Encode and upload all necessary
      requirements. 1.3 Verify Online Application. 1.4 Endorsement of the verified
      application. 1.5 Issue Tax Order of Payment.
    responsible: >
      BPLO Staff, Business Permits and Licensing Office; endorsing offices: Office
      of the Municipal Engineer, Office of the Municipal Health Officer, Bureau of
      Fire Protection
    max_time: 35 minutes
  - step: 2
    applicant_action: 2. Schedule a Local Fire Assessment (New)
    office_action: 2.1 Conduct an inspection and assessment on the business establishment
    responsible: BPLO Staff, Business Permits and Licensing Office
    max_time: 30 minutes
  - step: 3
    applicant_action: 3. Payment/Validated Payment (if online)
    office_action: >
      3.1 Shall receive payment of taxes, fees and charges, and issue corresponding
      official receipts
    responsible: Windows 1 – 4 Office of the Municipal Treasurer
    max_time: 15 minutes
  - step: 4
    applicant_action: >
      4. Submit a photocopy of the Receipt, Assessment, and Property Holdings to the
      Business Permit and Licensing Office
    office_action: >
      4. Prepare, print, and have the Business Permit signed by the Officer-in-Charge
      and the Local Chief Executive
    responsible: BPLO Staff, Business Permits and Licensing Office
    max_time: 1 day
  - step: 5
    applicant_action: >
      5. Claim Business Permit. Submit a photocopy of the official receipts and a
      Special Power of Attorney (if representative) upon release of business permit
    office_action: 5. Release of Business Permit
    responsible: BPLO Staff, Business Permits and Licensing Office
    max_time: 5 minutes
fees:
  - amount: null
    purpose: Taxes, fees and charges (Step 3)
    where_to_pay: Windows 1 – 4 Office of the Municipal Treasurer
    conditions: null
    basis: Based on the Municipal Tax and Revenue Code of 2022 of the Municipality of Palo, Province of Leyte
processing_time: 1 day, 1 hour, and 25 minutes
